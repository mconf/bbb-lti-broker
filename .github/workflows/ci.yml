name: CI

on:
  pull_request:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This repository is public, so it cannot use the organization's self-hosted
# runners. The shared portal-ruby-* jobs target them with no runs-on input, so
# the Ruby jobs below are repo-local; only all-trufflehog.yml takes a runs-on.
jobs:
  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint Ruby code for syntax errors and bugs
        # -l runs a lint check only, -f github annotates the diff
        run: bundle exec rubocop -l -f github --config .rubocop.yml

  scan_ruby:
    name: Brakeman Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        # Triaged findings live in config/brakeman.ignore, each with a note
        run: bundle exec brakeman -q

  scan_secrets:
    uses: mconf/mconf-ci-jobs/.github/workflows/all-trufflehog.yml@main
    with:
      runs-on: '["ubuntu-latest"]'
    secrets: inherit

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bbb_lti_broker_test
      # No redis service: config/initializers/resque.rb only builds a Redis
      # client, it never connects, and nothing in either suite touches a queue.
      # RELATIVE_URL_ROOT is deliberately unset. The routes are not scoped by it
      # but the path helpers prepend it, so any value makes every integration
      # request fall through to the catch-all 404 route.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare the test database
        run: bin/rails db:test:prepare

      - name: Run RSpec
        run: bundle exec rspec

      - name: Run Minitest
        run: bin/rails test
